name: keepalive

# Render 무료 티어 콜드스타트 방지 — 15분 유휴 시 잠들기 전에 10분마다 깨움.
# 유료(Starter) 전환하면 이 워크플로는 삭제해도 됨.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://wemeet-backend-xqlo.onrender.com/)
          echo "backend -> $code"
          test "$code" = "200"
