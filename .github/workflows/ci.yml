name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m pip check
      - run: python -m compileall -q backend/src
      - run: python -m pytest

  quality:
    name: Quality gate
    if: always()
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Require both checks to pass
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: test "$FRONTEND_RESULT" = success && test "$BACKEND_RESULT" = success
